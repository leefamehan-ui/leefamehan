<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.MR_TEACHER=(function(h){return h===""||h==="#"||/^#teacher/.test(h)})(location.hash);if(window.MR_TEACHER)document.documentElement.classList.add("tmode")</script>
<style>html.tmode body{padding:0!important;margin:0;background:#f7f0de}html.tmode body>*:not(#teacherFrame){display:none!important}#teacherFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f0de}</style>
<title>寻找大师的路线图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: 左侧一张不断“长大”的路线地图（带图层开关），右侧任务区；窄屏上下堆叠 */
:root{
  --paper:#f7f0de; --card:#fffaf0; --white:#ffffff;
  --ink:#3a3024; --ink-soft:#6f6250; --line:#d9c9a3;
  --gold:#b8862b; --gold-soft:#f6e7c4; --river:#3d7fc0; --orange:#e2772f; --green:#3c9657; --red:#d4513a; --plum:#8a4fa3;
  --good-bg:#e7f4e6; --bad-bg:#fbe9e4; --sky:#e4eff8; --mark:#ffe08a;
  --f-display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-text:"Noto Serif SC","Songti SC","SimSun",serif;
  color-scheme: light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.65;padding-inline:16px;padding-block:14px 32px;
  background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:22px 22px}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--river);outline-offset:2px}
.wrap{max-width:1420px;margin:0 auto}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4vw,46px);line-height:1.05;margin:0;color:var(--gold);
  letter-spacing:3px;text-shadow:2px 2px 0 var(--white),4px 4px 0 rgba(58,48,36,.16);text-wrap:balance}
.sub{font-family:var(--f-display);font-size:clamp(16px,1.7vw,21px);color:var(--ink-soft)}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:999px;
  padding:5px 14px;font-size:14px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.pill:active{transform:translateY(2px);box-shadow:none}
.clock{cursor:default;font-variant-numeric:tabular-nums;font-weight:700}

.layers{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lay{display:flex;align-items:center;gap:7px;border:2px dashed var(--line);border-radius:999px;padding:3px 12px 3px 4px;font-size:14px;color:var(--ink-soft);background:var(--card);cursor:default}
.lay b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--white);font-family:var(--f-display);font-weight:400}
.lay.now{border:2px solid var(--orange);color:var(--ink);font-weight:700}
.lay.now b{background:var(--orange)}
.lay.done{border:2px solid var(--green);color:var(--ink);cursor:pointer}
.lay.done b{background:var(--green)}
.lay.done.off{opacity:.5;border-style:dashed}
.review .opt,.review .chip,.review .blank{cursor:default}
.review .chips{display:none}
button.lay{font:inherit;cursor:pointer}
button.lay:hover{transform:translateY(-1px)}
body.finished .slot{cursor:pointer}
.lay input{width:16px;height:16px;accent-color:var(--green);margin:0}

.stage{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;margin-top:12px;align-items:start}
@media (max-width:940px){.stage{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--card);border:2px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 rgba(58,48,36,.16)}
.mapcol{display:grid;gap:12px;min-width:0}
.mapbox{overflow:hidden;position:relative}
#map{display:block;width:100%;height:auto;touch-action:manipulation}
#map text{font-family:var(--f-body)}
.disp{font-family:var(--f-display)!important}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;padding:8px 14px;font-size:13px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px}

/* map states */
.site{transition:opacity .8s,filter .8s}
.site.fog{opacity:0}
.site.current .glow{opacity:1}
.glow{opacity:0;transition:opacity .6s}
.cloud{transition:opacity .8s}
.cloud.gone{opacity:0}
.slot .badge{transition:fill .4s}
.slot.filled .badge{fill:var(--green)}
.slot.current .badge{fill:var(--orange)}
.slot.empty .frame{stroke-dasharray:6 5}
.slot.hot .frame{fill:#ffe2bd}
body.picking .slot .frame,body.dragging .slot .frame{fill:#fff1dc;stroke:#e2772f}
.ring{transform-box:fill-box;transform-origin:center;opacity:0}
.slot.current .ring{animation:pulse 1.6s infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.shimmer{animation:flow 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-140}}
.leg,.arm{transform-box:fill-box;transform-origin:50% 0}
.walking .leg.l,.walking .arm.r{animation:swing .36s ease-in-out infinite alternate}
.walking .leg.r{animation:swing .36s ease-in-out infinite alternate-reverse}
.walking .body{animation:bob .18s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes bob{to{transform:translateY(-2px)}}
.say{opacity:0;transition:opacity .3s}
.say.on{opacity:1}
.layer{transition:opacity .5s}
.layer.hide{opacity:0;pointer-events:none}
.rsign .q{animation:blink 1.2s ease-in-out infinite alternate}
@keyframes blink{to{opacity:.35}}
.growc{transform-box:fill-box;transform-origin:center;transition:transform 1.2s cubic-bezier(.3,1.4,.5,1)}
.popin{animation:popin .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popin{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.popin{transform-box:fill-box;transform-origin:center}

/* panel */
.panel{padding:18px 18px 22px;min-width:0}
@media (min-width:941px){.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 28px);overflow:auto}}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--ink-soft);font-weight:500}
.ph{border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:14px}
.ph h2{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(23px,2.4vw,30px);line-height:1.15}
.pb{display:grid;gap:14px}
.pb > *{min-width:0}
.talk{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--sky);border:2px solid var(--ink);overflow:hidden}
.avatar svg{width:100%;height:100%;display:block}
.bubble{background:var(--white);border:1.5px solid var(--ink);border-radius:4px 16px 16px 16px;padding:8px 12px}
.bubble .who{font-size:12px;color:var(--ink-soft);display:block}
.tip{background:var(--sky);border-radius:14px;padding:10px 14px;font-size:15px}
.tip b{color:var(--river)}
.task{border:2px solid var(--ink);border-radius:16px;padding:14px;background:var(--white);display:grid;gap:12px}
.task h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;display:flex;gap:10px;align-items:center}
.task h3 i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--white);font-size:15px;flex:none}
.task.done h3 i{background:var(--green)}
.task.locked{opacity:.45;pointer-events:none}
.q{font-size:17px;font-weight:500;line-height:1.7}
.hint{font-size:13px;color:var(--ink-soft)}
.para{font-family:var(--f-text);font-size:16.5px;line-height:2;background:var(--paper);border-radius:12px;padding:10px 14px;border-left:5px solid var(--gold)}
.para .pn{font-family:var(--f-display);color:var(--gold);margin-right:6px}
.sen{cursor:pointer;border-radius:4px;padding:1px 0;transition:background .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sen:hover{background:#fff3c9}
.sen.sel{background:var(--mark);box-shadow:0 2px 0 var(--orange)}
.sen.right{background:#cdeccc;box-shadow:0 2px 0 var(--green)}
.sen.wrong{background:#f8cfc4;animation:shake .4s}
.opts{display:grid;gap:10px}
.opt{font-size:16px;background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:9px 12px;cursor:pointer;box-shadow:0 3px 0 var(--ink);text-align:left;line-height:1.5;transition:transform .12s}
.opt .k{font-family:var(--f-display);color:var(--orange);margin-right:6px}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt.wrong{background:var(--bad-bg);border-color:var(--red);color:#8f2d1d;box-shadow:0 3px 0 var(--red)}
.opt.right{background:var(--good-bg);border-color:var(--green);color:#215c33;box-shadow:0 3px 0 var(--green)}
.opt:disabled{cursor:default}
.opt.shake,.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.opts.row4{grid-template-columns:repeat(2,minmax(0,1fr))}
.fb{border-radius:12px;padding:9px 13px;font-size:15px}
.fb.bad{background:var(--bad-bg);border:1.5px dashed var(--red)}
.fb.good{background:var(--good-bg);border:1.5px solid var(--green)}
.fb.good b{color:var(--green)}
.fb.info{background:var(--sky);border:1.5px solid var(--river)}
.readlock{background:#fff6e0;border:2px solid var(--gold);border-radius:14px;padding:10px 14px;display:grid;gap:8px}
.readlock .para{background:var(--white)}
.fields{display:grid;gap:10px}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:15px}
.field .ins{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{box-sizing:border-box;font-size:18px;border:2px solid var(--ink);border-radius:12px;padding:7px 10px;background:var(--white);color:var(--ink);width:100%;min-width:0}
.ins input{flex:1 1 90px;max-width:160px}
input.right{border-color:var(--green);background:var(--good-bg)}
input.wrong{border-color:var(--red);background:var(--bad-bg)}
textarea{width:100%;box-sizing:border-box;font-size:16px;border:1.5px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--white);color:var(--ink);resize:vertical;min-height:72px}
select{width:100%;min-width:130px;font-size:15px;padding:7px 8px;border:2px solid var(--ink);border-radius:10px;background:var(--white);color:var(--ink)}
select.right{border-color:var(--green);background:var(--good-bg)}
select.wrong{border-color:var(--red);background:var(--bad-bg)}
.matchwrap{overflow-x:auto}
table.match{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:420px}
table.match th{font-size:13px;color:var(--ink-soft);font-weight:500;text-align:left;padding:0 6px}
table.match td{padding:0 6px;vertical-align:middle}
table.match td:first-child{font-weight:700;white-space:nowrap}
table.guide td{vertical-align:top;padding:6px;border-bottom:1.5px dashed var(--line)}
table.guide td:nth-child(2){white-space:nowrap;color:var(--orange);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--f-display);font-size:20px;background:var(--orange);color:var(--white);border:2px solid var(--ink);border-radius:999px;padding:7px 22px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.green{background:var(--green)}
.btn.blue{background:var(--river)}
.btn.plum{background:var(--plum)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.chip{font-family:var(--f-display);font-size:19px;background:var(--plum);color:var(--white);border:2px solid var(--ink);border-radius:999px;padding:4px 16px;cursor:grab;box-shadow:0 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.chip.picked{outline:3px solid var(--river);outline-offset:2px;transform:translateY(-3px)}
.chip.used{opacity:.3;cursor:default}
.ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);opacity:.92;margin:0}
.stnbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.secret{border:2px solid var(--gold);border-radius:16px;padding:12px 14px;background:linear-gradient(135deg,#fff8e4,#fff);display:grid;gap:4px;animation:pop .6s}
.secret .eyebrow{color:var(--gold)}
.secret b.big{font-family:var(--f-display);font-weight:400;font-size:24px;color:#7a4a2a}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:none}}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:8px;align-items:center;background:var(--paper);border-radius:10px;padding:6px 10px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--green)}
.sum{display:grid;gap:10px}
.sumrow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;border-bottom:1.5px dashed var(--line);padding-bottom:10px}
.sumrow i{font-style:normal;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--white);font-family:var(--f-display);font-size:18px}
.sumrow .ev{font-family:var(--f-text);font-size:15px;color:var(--ink-soft)}
.sumrow .mine{font-size:15px;background:var(--paper);border-radius:8px;padding:4px 8px;margin-top:4px}
.teacher{display:inline-flex;gap:6px;align-items:center;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:999px;padding:2px 10px;font-size:13px;color:#7a4a2a}

.modal{position:fixed;inset:0;background:rgba(40,32,22,.55);display:grid;place-items:center;padding:16px;z-index:90}
.sheet{width:min(820px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:20px 22px 24px;position:relative}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0 0 8px;color:var(--gold)}
.close{position:absolute;top:12px;right:12px}
.text p{margin:0 0 10px;font-family:var(--f-text);font-size:16.5px;line-height:1.9}
.text p b{display:inline-block;min-width:1.6em;font-family:var(--f-display);color:var(--gold)}

/* ---------- 建筑卡 ---------- */
.album-pill b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--orange)}
.album-pill.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.25)}}
.bcard{--cc:var(--gold);width:100%;box-sizing:border-box;background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:10px 12px 12px;display:grid;gap:6px;box-shadow:0 5px 0 var(--ink);text-align:left;position:relative;overflow:hidden}
.bcard::before{content:"";position:absolute;inset:0 0 auto;height:40px;background:var(--cc);opacity:.9}
.bc-top{position:relative;display:flex;justify-content:space-between;align-items:center;color:var(--white);font-weight:700;font-size:13px;min-height:22px}
.bc-tag{background:var(--white);color:var(--cc);border-radius:999px;padding:0 10px;font-size:12px;border:2px solid var(--ink)}
.bc-art{width:100%;height:auto;display:block;border:2px solid var(--ink);border-radius:12px;position:relative;background:var(--white)}
.bc-name{font-family:var(--f-display);font-size:24px;line-height:1.15;color:var(--ink)}
.bc-sub{font-size:13px;color:var(--ink-soft);margin-top:-4px}
.bc-facts{margin:0;padding-left:1.1em;font-size:14px;line-height:1.55;display:grid;gap:2px}
.bc-quote{font-family:var(--f-text);font-size:14px;background:var(--paper);border-left:4px solid var(--cc);border-radius:6px;padding:6px 8px}
.bc-owner{font-size:12px;color:var(--ink-soft);text-align:right;border-top:1.5px dashed var(--line);padding-top:4px}
.bcard.back{background:repeating-linear-gradient(45deg,var(--gold-soft) 0 10px,#f1dcaa 10px 20px);min-height:100%}
.bcard.back::before{display:none}
.bc-back{display:grid;place-items:center;gap:6px;align-content:center;min-height:260px;text-align:center}
.bc-back b{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--white);border:3px solid var(--ink);font-family:var(--f-display);font-weight:400;font-size:52px;color:var(--gold)}
.bc-back span{font-family:var(--f-display);font-size:17px;color:var(--ink);background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:1px 12px}
.cardsheet{width:min(400px,100%);text-align:center;display:grid;gap:14px}
.cardsheet h2{margin:0}
.card3d{perspective:1200px;width:min(300px,100%);margin:0 auto}
.flip{display:grid;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
.flip.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f-front{transform:rotateY(180deg)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.acard{all:unset;cursor:pointer;display:block;border-radius:18px}
.acard:focus-visible{outline:3px solid var(--river);outline-offset:3px}
.acard:hover .bcard{transform:translateY(-3px)}
.acard .bcard{transition:transform .15s;font-size:13px}
.acard .bc-name{font-size:19px}
.acard .bc-facts,.acard .bc-quote,.acard .bc-owner{display:none}
.acard.locked{cursor:default;opacity:.75}
.acard.locked .bc-back{min-height:200px}
.bigcard{width:min(340px,100%);margin:0 auto 12px}
@media (prefers-reduced-motion: reduce){.flip{transition:none}.album-pill.bump{animation:none}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:95;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- cover ---------- */
.cover{min-height:calc(100vh - 46px);display:grid;place-items:center;padding-block:10px}
.cover-card{width:min(620px,100%);background:var(--card);border:2px solid var(--ink);border-radius:28px;box-shadow:6px 6px 0 rgba(58,48,36,.18);padding:16px 16px 28px;display:grid;gap:10px;justify-items:center;text-align:center;animation:rise .7s cubic-bezier(.3,1.4,.5,1) both}
.cover-card svg{width:100%;height:auto;display:block;border-radius:20px;border:2px solid var(--ink)}
.ctitle{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,56px);line-height:1.1;margin:6px 0 0;color:var(--gold);letter-spacing:4px;text-shadow:2px 2px 0 var(--white),4px 4px 0 rgba(58,48,36,.16)}
.csub{margin:0;font-size:17px;color:var(--ink-soft);max-width:30em}
.cname{display:grid;gap:6px;justify-items:center;width:100%;margin-top:6px}
.cname label{font-family:var(--f-display);font-size:20px}
.cname input{max-width:300px;text-align:center;font-size:22px;border-radius:999px;padding:9px 16px;border-width:2.5px}
.btn.big{font-size:26px;padding:9px 44px;margin-top:4px}
.ctag{font-family:var(--f-display);font-size:17px;background:var(--gold-soft);border:2px solid var(--ink);border-radius:999px;padding:2px 16px;margin-top:4px}
.codebox textarea{width:100%;box-sizing:border-box;font:600 14px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:2px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);resize:none;word-break:break-all}
.substat{font-size:16px;background:var(--white);border:2px dashed var(--line);border-radius:12px;padding:10px 12px}
.substat .okc{color:var(--green)} .substat .badc{color:var(--red)}
.codebox.backup{opacity:.85}
.cerr{color:var(--red);font-size:15px;min-height:1.4em}
.cover.leaving .cover-card{animation:leave .6s ease-in forwards}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes leave{to{transform:translateY(-50px) scale(.92);opacity:0}}
.pre{visibility:hidden;height:0;overflow:hidden}
.enter{animation:fadein .7s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.floaty{animation:floaty 2.6s ease-in-out infinite alternate}
@keyframes floaty{to{transform:translateY(-10px)}}
.drift{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(26px)}}
.hop{animation:hop .9s ease-in-out infinite alternate}

/* ---------- word blanks ---------- */
.sent{font-size:clamp(17px,2vw,20px);line-height:2.4;background:var(--paper);border-radius:12px;padding:6px 14px;border-left:5px solid var(--orange)}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:3.4em;height:1.8em;vertical-align:middle;margin:0 4px;border:2.5px dashed var(--orange);border-radius:10px;background:#fff7ec;color:var(--ink);font:inherit;font-weight:700;padding:0 6px;cursor:pointer}
body.dragging .blank.open,body.picking .blank.open{background:#ffe2bd}
.blank.hot{background:#ffd29a!important}
.blank.right{border-style:solid;border-color:var(--green);background:var(--good-bg);color:#215c33}
.blank.wrong{border-color:var(--red);background:var(--bad-bg);animation:shake .4s}
.chip.word{background:var(--orange)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Raffles viewer ---------- */
.viewer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

.vcell{background:var(--sky);border-radius:14px;padding:8px;display:grid;gap:6px;justify-items:center;text-align:center;font-size:13px;color:var(--ink-soft)}
.vcell svg{width:100%;max-width:210px;height:auto}
.vcell input[type=range]{width:100%;accent-color:var(--orange)}
.seen{font-size:14px}
.seen i{font-style:normal;color:var(--green);font-weight:700}
.vcap{font-size:14px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
/* 寻找大师的路线图：课文、题目、完成码（学生端和教师端共用） */
/* ---------- 课文 ---------- */
const LESSON=[
 '工艺设计课的老师布置了假期作业，让我们设计一个别具特色的建筑模型。正当我伤脑筋的时候，爸爸故作神秘地说，他可以带我去拜访一位有名的建筑大师，但要走很长一段路。我欣喜万分，满口答应。',
 '爸爸带我来到中央商业区，我们沿着新加坡河漫步。走着走着，爸爸指着不远处一座外观独特的大楼问我：“那座大楼的外观像一个汉字，你能看出是什么字吗？”我绞尽脑汁，还是想不到。爸爸得意地说：“是繁体字‘貝’。古时候人们曾经把贝壳当作钱来使用，所以用‘贝’做偏旁的字，很多都跟钱财有关。你知道吗？这座楼就是华侨银行大楼。”“贝”代表钱，银行不就是与钱打交道吗？想到这里，我由衷佩服设计师的巧思。不过，建筑大师该不会住在银行大楼里吧？爸爸似乎看出我的疑惑，笑着说：“别急，我们先去来福士城吃午餐。”',
 '我们沿着桥北路走，不久就看到远处的来福士城大楼。这座楼从一面看是个圆柱体，从另一面看又是个长方体，别具一格。吃完午餐，爸爸还要走一走。',
 '我们离开来福士城，顺着美芝路来到新门广场。这里有两座摩天大楼，好像两扇打开的大门。大楼的形状独树一帜，看上去就像薄薄的刀片一样。爸爸说，有人认为大楼设计成这种形状，有消除灾祸的用意。虽然这只是传言，却让我对建筑设计产生了更多的好奇心。',
 '我问爸爸那位建筑大师住在哪里，他却说：“你已经见过他了，他就是贝聿铭先生。这三座建筑都是他设计的。”我这才恍然大悟，原来爸爸是希望我从这位大师的建筑中获得设计的灵感。',
 '回到家后，通过查找资料，我对贝聿铭先生有了更多的了解。他是一名建筑设计大师，他的很多建筑今天都已经成为知名的地标，但有些却曾受尽批评。例如，他为法国卢浮宫设计的玻璃金字塔，这一建筑造型大胆独特，遭到了很多人的质疑和抨击。面对挫折，他这样说：“我和我的建筑都像竹子，再大的风雨也只是弯弯腰而已。”',
 '这次的建筑之旅，不但让我对新加坡的建筑有了新的认识，也让我从这位建筑大师身上学到很多。'];

const PLACES=['中央商业区','华侨银行大楼','来福士城','新门广场','家'];
const CARDS=['来福士城','滨海湾金沙','家','中央商业区','新门广场','华侨银行大楼'];
const NAMES=['起点','第1站','第2站','第3站','终点'];

/* ---------- 完成码（学生端生成，教师端读取） ----------
   MR1|班级码|姓名|用时秒|每题记录|校验
   每题记录：错误次数 + 误选字母（选择题=选项 A-D；地点=地点卡；转换词=词卡），用 . 隔开 */
const QLIST=[];
ST.forEach((st,k)=>st.steps.forEach((s,i)=>{if(s.type!=='viewer')QLIST.push({k,i,s})}));
const CODE_RE=/MR1\|([^|\n]*)\|([^|\n]*)\|(\d{1,6})\|([0-9A-Z.]+)\|([0-9A-Z]{2})/g;
function codeSum(t){let h=7;for(const ch of t)h=(h*31+ch.codePointAt(0))%1296;return h.toString(36).toUpperCase().padStart(2,'0')}
function makeCode(cls,name,secs,rec){
  const items=QLIST.map(q=>{const r=rec[q.k+'.'+q.i]||{n:0,p:''};return Math.min(9,r.n)+r.p}).join('.');
  const body=`MR1|${(cls||'-').replace(/[|\n]/g,'')}|${String(name).replace(/[|\n]/g,'').trim()}|${secs}|${items}`;
  return body+'|'+codeSum(body);
}
function readCodes(text){
  const out=[];let m;CODE_RE.lastIndex=0;
  while((m=CODE_RE.exec(text))){
    const body=m[0].slice(0,m[0].length-3);
    if(codeSum(body)!==m[5]){out.push({bad:true,raw:m[0]});continue}
    const it=m[4].split('.');
    if(it.length!==QLIST.length){out.push({bad:true,raw:m[0]});continue}
    out.push({cls:m[1],name:m[2],secs:+m[3],items:it.map(x=>({n:+x[0],p:x.slice(1)}))});
  }
  return out;
}

<script>
/* 学生端 → 教师端：经免费转发服务 ntfy.sh 传送，内容先用链接里的密钥加密（AES-GCM），转发服务看不到名字和作答 */
const RELAY_HOST='https://ntfy.sh/';
const B64U={
  enc:buf=>{let s='';new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
  dec:s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0))
};
const ROOM_RE=/^[A-Za-z0-9_-]{16,64}$/, KEY_RE=/^[A-Za-z0-9_-]{22}$/;
function randToken(n){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';let r='';for(const x of crypto.getRandomValues(new Uint32Array(n)))r+=A[x%A.length];return r}
function newKey(){return B64U.enc(crypto.getRandomValues(new Uint8Array(16)))}
const _keys={};
function aesKey(k){return _keys[k]||(_keys[k]=crypto.subtle.importKey('raw',B64U.dec(k),'AES-GCM',false,['encrypt','decrypt']))}
async function seal(k,text){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(k),new TextEncoder().encode(text)));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);
  return 'MRX1.'+B64U.enc(out);
}
async function unseal(k,s){
  if(typeof s!=='string'||!s.startsWith('MRX1.'))return null;
  try{const b=B64U.dec(s.slice(5));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},await aesKey(k),b.slice(12));return JSON.parse(new TextDecoder().decode(pt))}catch(e){return null}
}

</script>

    ${MOOD.map(m=>`<circle cx="${m.x}" cy="${Y(m.l)}" r="5" fill="#d4513a"/><text x="${m.x+(m.a==='start'?8:m.a==='end'?-8:0)}" y="${Y(m.l)+m.dy}" text-anchor="${m.a}" font-size="12.5" font-weight="700" fill="#3a3024">${m.w}</text>`).join('')}</g>`;
  $('#L3').innerHTML=pins+strip;
}

/* ---------- layer 4: suspense balloon ---------- */
function balloonSVG(x,y,txt){return `<g transform="translate(${x},${y})"><path d="M0,22 q-4,14 3,26" fill="none" stroke="#3a3024" stroke-width="1.5"/><ellipse cx="0" cy="0" rx="26" ry="24" fill="#b07ccc" stroke="#3a3024" stroke-width="2"/><path d="M-4,22 L4,22 L0,27Z" fill="#8a4fa3" stroke="#3a3024" stroke-width="1.2"/><ellipse cx="-9" cy="-9" rx="6" ry="4" fill="#fff" opacity=".6"/><text x="0" y="9" text-anchor="middle" class="disp" font-size="26" fill="#fff">${txt||'?'}</text></g>`}
function burstSVG(x,y){return `<g transform="translate(${x},${y})"><path d="M0,-34 L8,-12 L30,-18 L14,0 L32,16 L9,13 L0,34 L-9,13 L-32,16 L-14,0 L-30,-18 L-8,-12Z" fill="#ffd27a" stroke="#3a3024" stroke-width="2"/><text x="0" y="7" text-anchor="middle" class="disp" font-size="20" fill="#7a4a2a">!</text></g>`}
function drawL4(stage){
  // stage 0: nothing; 1: balloon at OCBC; 2: + burst at Gateway; 3: trail
  let h='';
  if(stage>=3){
    const a=segs[1],b=segs[2];
    h+=`<path d="${a.p.getAttribute('d')}" fill="none" stroke="#8a4fa3" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round" transform="translate(0,-70)"/>`;
    h+=`<path d="${b.p.getAttribute('d')}" fill="none" stroke="#8a4fa3" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round" transform="translate(0,-70)"/>`;
  }
  if(stage>=1)h+=`<g class="popin">${balloonSVG(395,300)}<rect x="315" y="236" width="160" height="28" rx="14" fill="#8a4fa3" stroke="#3a3024" stroke-width="1.5"/><text x="395" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">大师在哪里？</text></g>`;
  if(stage>=2)h+=`<g class="popin">${burstSVG(770,252)}<rect x="708" y="190" width="124" height="28" rx="14" fill="#ffd27a" stroke="#3a3024" stroke-width="1.5"/><text x="770" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4a2a">贝聿铭！</text></g>`;
  $('#L4').innerHTML=h;
}
function flyBalloon(){
  const g=$('#balloonFly');
  const go=(seg)=>anim(2600,e=>{const p=ptAt(seg,e);g.innerHTML=balloonSVG(p.x,p.y-70)});
  return go(2).then(()=>go(3)).then(()=>{const p=ptAt(3,1);g.innerHTML=burstSVG(p.x,p.y-70)+`<text x="${p.x}" y="${p.y-112}" text-anchor="middle" class="disp" font-size="26" fill="#8a4fa3">贝聿铭！</text>`;return new Promise(r=>setTimeout(()=>{g.innerHTML='';r()},1500))});
}

function pinsFor(i){const [x,y]=PIN[i];const g=document.createElementNS(NS,'g');g.setAttribute('class','popin');g.innerHTML=eye(x,y)+heart(x+32,y);$('#L3').appendChild(g)}
function layerVisible(n,on){$('#L'+n).classList.toggle('hide',!on);$('#L'+n).classList.add('layer')}
function reset(){
  for(let i=1;i<=4;i++)reveal(i,0);
  for(let i=0;i<5;i++){showSite(i,false);siteCurrent(i,false);setSlot(i,'','empty')}
  L0.signs=['','','','',''];drawL0();
  ['L1','L2','L3','L4','balloonFly'].forEach(id=>$('#'+id).innerHTML='');
  for(let n=0;n<=4;n++)layerVisible(n,true);
  setWalker(START.x,START.y,1);
}
window.MAP={pinsFor,walk,say,setSlot,slotsDroppable,showSite,siteCurrent,setRoadWord,drawL1,drawL2,growL2,drawL3,drawL4,flyBalloon,layerVisible,reset,reveal,setWalker,ptAt};
reset();
})();

</script>
<script>
/* 练：寻找大师的路线图（封面 + 一站一站版） */
const $=s=>document.querySelector(s);
const P=$('#pbody'),H=$('#phead');
const NARROW=()=>window.innerWidth<=940;

let S,timer;
function fresh(){return{name:'',st:-1,t0:0,t1:0,picked:null,log:[],snap:[],rec:{},sid:newSid(),sub:'',cards:[]}}
function newSid(){const A='abcdefghijkmnpqrstuvwxyz23456789';let r='';try{for(const x of crypto.getRandomValues(new Uint32Array(12)))r+=A[x%A.length]}catch(e){for(let i=0;i<12;i++)r+=A[Math.floor(Math.random()*A.length)]}return r}
/* 班级码：老师给的链接末尾 #1E2-K7QX */
const QS=(()=>{try{return new URLSearchParams(location.search)}catch(e){return new URLSearchParams('')}})();
const HP=(()=>{try{const h=location.hash.slice(1);return h.includes('=')?new URLSearchParams(h):null}catch(e){return null}})();
const CLS=(()=>{try{const h=QS.get('c')||(HP?HP.get('c')||'':decodeURIComponent(location.hash.slice(1)));return CLASS_RE.test(h)?h:''}catch(e){return ''}})();
/* 单一文件版：学生链接 #c=班级码&r=房间&k=密钥 */
const RELAY=(()=>{if(!HP||typeof seal!=='function'||!window.crypto||!crypto.subtle)return null;const r=HP.get('r')||'',k=HP.get('k')||'';return ROOM_RE.test(r)&&KEY_RE.test(k)?{r,k}:null})();
/* 老师的收作答程序：链接里的 ?s=程序ID */
const API=(()=>{const id=QS.get('s')||'';return /^[A-Za-z0-9_-]{20,120}$/.test(id)?`https://script.google.com/macros/s/${id}/exec`:''})();
function itemsUpTo(stDone){return QLIST.map(q=>{if(q.k>=stDone)return '-';const r=S.rec[q.k+'.'+q.i]||{n:0,p:''};return Math.min(9,r.n)+r.p}).join('.')}
let sendChain=Promise.resolve();
/* 经转发服务送出：只在出发和完成时各送一次，避免同一校园网络送得太多 */
function relaySend(stDone,done){
  if(!S.name||(!done&&stDone>0))return Promise.resolve(true);
  const payload={v:1,sid:S.sid,cls:CLS,name:S.name,st:stDone,secs:Math.floor(((S.t1||Date.now())-S.t0)/1000),it:itemsUpTo(stDone),done:!!done,ts:Date.now()};
  const run=async()=>{
    const body=await seal(RELAY.k,JSON.stringify(payload));
    for(let t=0;t<6;t++){
      try{const r=await fetch(RELAY_HOST+RELAY.r,{method:'POST',body});if(r.ok)return true;if(r.status!==429&&r.status<500)return false}catch(e){}
      await new Promise(res=>setTimeout(res,2000*(t+1)+Math.random()*3000));
    }
    return false;
  };
  return sendChain=sendChain.then(run,run);
}
function send(stDone,done){
  if(RELAY)return relaySend(stDone,done);
  if(!API||!S.name)return Promise.resolve(false);
  const body=JSON.stringify({action:'submit',sid:S.sid,cls:CLS,name:S.name,st:stDone,secs:Math.floor(((S.t1||Date.now())-S.t0)/1000),it:itemsUpTo(stDone),done:!!done});
  const once=async()=>{
    try{const r=await fetch(API,{method:'POST',body});const j=await r.json();if(j&&j.ok)return true;if(j&&j.err==='busy')throw 0;return false}
    catch(e){try{await fetch(API,{method:'POST',mode:'no-cors',body});return 'maybe'}catch(_){return false}}};
  const run=async()=>{for(let t=0;t<4;t++){const ok=await once();if(ok)return ok;await new Promise(r=>setTimeout(r,1500*(t+1)+Math.random()*1500))}return false};
  return sendChain=sendChain.then(run,run);
}
function miss(k,i,letter){const key=k+'.'+i;const r=S.rec[key]||(S.rec[key]={n:0,p:''});r.n++;if(letter&&!r.p.includes(letter)&&r.p.length<4)r.p+=letter}

/* ---------- helpers ---------- */
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild}
function add(html,parent){const e=el(html);(parent||P).appendChild(e);return e}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fb(host,kind,html){let f=host.querySelector(':scope > .fb.live');if(!f)f=add('<div class="fb live"></div>',host);f.className='fb live '+kind;f.innerHTML=html;return f}
function shake(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}
function dad(html,parent){return add(`<div class="talk"><div class="avatar">${PEOPLE.avatar('dad')}</div><div class="bubble"><span class="who">爸爸</span>${html}</div></div>`,parent)}
function head(eyebrow,title){H.innerHTML=`<div class="ph"><div class="eyebrow">${eyebrow}</div><h2>${title}</h2></div>`}
function task(n,title,locked){return add(`<div class="task ${locked?'locked':''}"><h3><i>${n}</i>${title}</h3></div>`)}
function done(t){t.classList.add('done');t.querySelector('h3 i').textContent='✓'}
function unlock(t){t.classList.remove('locked');setTimeout(()=>t.scrollIntoView({behavior:'smooth',block:'nearest'}),200)}
function paraHTML(pn){return `<div class="para"><span class="pn">第${pn}段</span>${LESSON[pn-1]}</div>`}
function readHint(w,paras){if(paras&&!w.querySelector('.readlock'))add(`<div class="readlock"><b>读一读，再试一次</b>${paras.map(paraHTML).join('')}</div>`,w)}
function toPanel(){if(NARROW())setTimeout(()=>$('.panel').scrollIntoView({behavior:'smooth',block:'start'}),300)}
function toMap(){if(NARROW())$('.mapbox').scrollIntoView({behavior:'smooth',block:'start'})}

/* 单选 */
function mcq(host,o,onRight){
  const w=add('<div class="pb"></div>',host);
  add(`<div class="q">${o.q}</div>`,w);
  const box=add('<div class="opts"></div>',w);let tries=0;
  const bs=o.opts.map(([t,v],i)=>{
    const b=add(`<button type="button" class="opt"><span class="k">${'ABCD'[i]}</span>${t}</button>`,box);
    b.onclick=()=>{
      if(v===1){b.classList.add('right');bs.forEach(x=>x.disabled=true);w.querySelector('.readlock')?.remove();fb(w,'good',`<b>答对了！</b>${o.explain||''}`);onRight(t);return}
      b.classList.add('wrong');shake(b);b.disabled=true;tries++;o.onWrong&&o.onWrong(i);fb(w,'bad',v);if(tries>=2)readHint(w,o.para);
    };return b;
  });
}
/* 多选 */
function msq(host,o,onRight){
  const w=add('<div class="pb"></div>',host);
  add(`<div class="q">${o.q}</div>`,w);
  const box=add('<div class="opts"></div>',w);let tries=0;
  const bs=o.opts.map(([t],i)=>{const b=add(`<button type="button" class="opt" aria-pressed="false"><span class="k">${'ABCD'[i]}</span>${t}</button>`,box);
    b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.style.background=on?'#fff1dc':'';b.style.borderColor=on?'var(--orange)':''};return b});
  const r=add('<div class="row"><button type="button" class="btn blue">检查</button></div>',w);
  r.querySelector('.btn').onclick=()=>{
    const sel=bs.map(b=>b.getAttribute('aria-pressed')==='true');
    if(sel.filter(Boolean).length!==o.need){fb(w,'bad',`请选${o.need}个。`);return}
    const wrong=o.opts.map((op,i)=>sel[i]&&op[1]!==1?i:-1).filter(i=>i>=0);
    if(!wrong.length){bs.forEach((b,i)=>{b.disabled=true;b.style.background='';b.style.borderColor='';if(o.opts[i][1]===1)b.classList.add('right')});r.remove();w.querySelector('.readlock')?.remove();fb(w,'good','<b>答对了！</b>');onRight();return}
    tries++;o.onWrong&&o.onWrong(wrong);wrong.forEach(i=>shake(bs[i]));fb(w,'bad',wrong.map(i=>`「${o.opts[i][0]}」：${o.opts[i][1]}`).join('<br>'));if(tries>=2)readHint(w,o.para);
  };
}

/* ---------- 拖放 / 点选 ---------- */
let drag=null;
function bindChip(chip,payload,onDrop){
  const pick=()=>{const was=S.picked&&S.picked.chip===chip;clearPick();if(!was){S.picked={chip,payload,onDrop};chip.classList.add('picked');document.body.classList.add('picking')}};
  chip.addEventListener('pointerdown',e=>{if(chip.classList.contains('used'))return;e.preventDefault();try{chip.setPointerCapture(e.pointerId)}catch(_){};drag={chip,x0:e.clientX,y0:e.clientY,ghost:null,hot:null}});
  chip.addEventListener('pointermove',e=>{
    if(!drag||drag.chip!==chip)return;
    if(!drag.ghost&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>6){drag.ghost=chip.cloneNode(true);drag.ghost.classList.add('ghost');drag.ghost.classList.remove('picked');document.body.appendChild(drag.ghost);document.body.classList.add('dragging')}
    if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';const t=document.elementFromPoint(e.clientX,e.clientY);const z=t&&t.closest('[data-drop]');if(drag.hot&&drag.hot!==z)drag.hot.classList.remove('hot');if(z){z.classList.add('hot');drag.hot=z}}
  });
  chip.addEventListener('pointerup',e=>{
    if(!drag||drag.chip!==chip)return;const d=drag;drag=null;document.body.classList.remove('dragging');if(d.hot)d.hot.classList.remove('hot');
    if(d.ghost){d.ghost.remove();clearPick();const t=document.elementFromPoint(e.clientX,e.clientY);const z=t&&t.closest('[data-drop]');if(z)onDrop(payload,z,chip)}else pick();
  });
  chip.addEventListener('pointercancel',()=>{if(drag&&drag.ghost)drag.ghost.remove();drag=null;document.body.classList.remove('dragging')});
  chip.addEventListener('click',e=>{if(e.detail===0)pick()});
}
function clearPick(){if(S)S.picked=null;document.body.classList.remove('picking');document.querySelectorAll('.chip.picked').forEach(c=>c.classList.remove('picked'))}
function dropOn(z){if(!S||!S.picked)return;const p=S.picked;clearPick();p.onDrop(p.payload,z,p.chip)}
document.addEventListener('click',e=>{const z=e.target.closest('[data-drop]');if(z)dropOn(z)});
document.addEventListener('keydown',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z&&(e.key==='Enter'||e.key===' ')){e.preventDefault();dropOn(z)}});

/* ---------- 进度、时钟 ---------- */
function renderProg(view){
  const fin=S.st>4;
  $('#layers').innerHTML=NAMES.map((n,i)=>{const d=i<S.st,now=i===S.st||view===i;
    return fin?`<button type="button" class="lay done ${view===i?'now':''}" data-review="${i}"><b>✓</b>${PLACES[i]}</button>`
      :`<span class="lay ${d?'done':''} ${now?'now':''}"><b>${d?'✓':i===0?'起':i===4?'终':i}</b>${d?PLACES[i]:n}</span>`}).join('')
    +(fin?`<button type="button" class="lay done ${view===undefined?'now':''}" data-review="sum"><b>表</b>导览表</button>`:'');
}
document.addEventListener('click',e=>{
  if(!S||S.st<=4)return;
  const b=e.target.closest('[data-review]');if(b){const v=b.dataset.review;v==='sum'?summary():review(+v);return}
  const sl=e.target.closest('.slot');if(sl)review(+sl.dataset.i);
});
document.addEventListener('keydown',e=>{if(!S||S.st<=4)return;const sl=e.target.closest&&e.target.closest('.slot');if(sl&&(e.key==='Enter'||e.key===' ')){e.preventDefault();review(+sl.dataset.i)}});
function tick(){const end=S.t1||Date.now();const s=S.t0?Math.floor((end-S.t0)/1000):0;$('#clock').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}

/* ================= 封面 ================= */
$('#coverPeople').innerHTML=`<g class="hop"><ellipse cx="-12" cy="1" rx="26" ry="4" fill="#3a3024" opacity=".18"/>${kidSVG(-27)}${dadSVG()}</g>`;
function showCover(){
  if(CLS){$('#ctag').hidden=false;$('#ctag').textContent='班级 '+CLS.replace(/-[A-Z0-9]{4}$/,'')}
  $('#cover').hidden=false;$('#cover').classList.remove('leaving');
  const g=$('#game');g.classList.add('pre');g.classList.remove('enter');
  $('#sname').value='';$('#cerr').textContent='';
  setTimeout(()=>$('#sname').focus({preventScroll:true}),300);
}
$('#go').onclick=()=>{
  const v=$('#sname').value.trim();
  if(!v){$('#cerr').textContent='先写上你的名字，才能出发哦！';shake($('#sname'));$('#sname').focus();return}
  S.name=v;$('#cover').classList.add('leaving');
  setTimeout(()=>{$('#cover').hidden=true;const g=$('#game');g.classList.remove('pre');g.classList.add('enter');window.scrollTo(0,0);
    S.t0=Date.now();clearInterval(timer);timer=setInterval(tick,1000);station(0);send(0,false)},600);
};
$('#sname').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});

/* ================= 每一站 ================= */
function station(k){
  S.st=k;renderProg();P.innerHTML='';$('.panel').scrollTop=0;
  const st=ST[k];const L=S.log[k]={};
  head(`${NAMES[k]} / 共5站`,k===0?`${esc(S.name)}，出发吧！`:`下一站：${NAMES[k]}`);
  dad(k===0?'我们从哪里出发？先把起点的地点卡拖到地图上闪动的站牌。':`下一站是哪里？把正确的地点卡拖到地图上闪动的${NAMES[k]}。`);
  for(let i=0;i<5;i++)MAP.siteCurrent(i,i===k);
  MAP.setSlot(k,undefined,'current');MAP.slotsDroppable(true);
  const tasks=st.steps.map((s,i)=>task(i+1,s.must?`必答题：${s.must}`:s.type==='place'?'这一站是哪里？':s.title,i>0));
  const next=i=>{if(i+1<tasks.length)unlock(tasks[i+1]);else nextBtn()};
  st.steps.forEach((s,i)=>{
    const t=tasks[i];
    if(s.type==='place')placeStep(t,k,L,()=>{done(t);next(i)});
    else if(s.type==='words')wordsStep(t,k,s,()=>{done(t);arrive(k,()=>next(i))});
    else if(s.type==='viewer')viewerStep(t,()=>{done(t);next(i)});
    else if(s.type==='msq')msq(t,{...s,onWrong:ws=>{miss(k,i,'');const r=S.rec[k+'.'+i];ws.forEach(j=>{const L='ABCD'[j];if(!r.p.includes(L))r.p+=L})}},()=>{if(s.log)L[s.log]=s.show;done(t);next(i)});
    else mcq(t,{q:s.q,opts:s.opts,para:s.para,explain:s.explain,onWrong:j=>miss(k,i,'ABCD'[j])},w=>{if(s.log)L[s.log]=s.show||w;if(s.pin)MAP.pinsFor(s.pin);done(t);next(i)});
  });
  function nextBtn(){
    const last=k===4;
    const r=add(`<div class="row"><button type="button" class="btn green">${last?'完成路线图':`前往${NAMES[k+1]}`}</button></div>`);
    r.querySelector('button').onclick=()=>{r.remove();S.snap[k]=P.innerHTML;giveCard(k,()=>{if(last)finish();else{station(k+1);send(k+1,false)}})};
    r.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  toPanel();
}
function arrive(k,then){
  const fin=()=>{MAP.showSite(k,true);MAP.siteCurrent(k,false);MAP.setSlot(k,PLACES[k],'filled',k===0?'来到':undefined);MAP.say(ST[k].say);then();toPanel()};
  if(k===0){fin();return}
  MAP.setRoadWord(k,ST[k].steps[1].sign);toMap();MAP.walk(k).then(fin);
}

/* 拖地点 */
function placeStep(t,k,L,ok){
  add(`<div class="hint">把地点卡拖到地图上闪动的${NAMES[k]}（也可以先点卡片，再点站牌）。</div>`,t);
  const tray=add('<div class="chips"></div>',t);
  CARDS.forEach(c=>{const idx=PLACES.indexOf(c);if(idx>=0&&idx<k)return;const chip=add(`<button type="button" class="chip">${c}</button>`,tray);bindChip(chip,c,drop)});
  function drop(name,z,chip){
    if(L.place)return;
    if(z.dataset.drop!=='slot'){fb(t,'bad','地点卡要放到<b>地图</b>上的站牌。');return}
    const i=+z.dataset.i;
    if(i!==k){fb(t,'bad',`请放到地图上闪动的${NAMES[k]}。`);toPanel();return}
    if(name!==PLACES[k])miss(k,0,'ABCDEF'[CARDS.indexOf(name)]);
    if(name==='滨海湾金沙'){shake(chip);chip.classList.add('used');fb(t,'bad','「滨海湾金沙」在课文里出现过吗？它不在这条路线上，这张卡已经帮你拿走了。');toPanel();return}
    if(name!==PLACES[k]){shake(chip);const o=PLACES.indexOf(name);fb(t,'bad',`「${name}」是课文里的${NAMES[o]}，不是${NAMES[k]}。想想课文的顺序。`);toPanel();return}
    L.place=name;MAP.slotsDroppable(false);MAP.setSlot(k,name,'current');tray.querySelectorAll('.chip').forEach(c=>c.classList.add('used'));
    fb(t,'good',`<b>对！</b>${NAMES[k]}是${name}。`);ok();toPanel();
  }
}

/* 拖转换词 */
function whyWord(k,j,word,ans){
  if(word===ans)return '';
  if(k===4&&word==='来到')return '家是出发前的地方，回去要用哪个词？';
  if(k===3&&j===0&&word==='来到')return '这里是从来福士城<b>出发</b>，不是到达。';
  if(k===3&&j===2&&word==='离开')return '新门广场是要<b>到达</b>的地方。';
  if((word==='顺着'&&ans==='沿着')||(word==='沿着'&&ans==='顺着'))return '意思很接近，但课文这里用的不是这个词，回去看看。';
  if(word==='来到')return '“来到”后面要接目的地，这里接的是一条路。';
  if(word==='离开')return '“离开”后面要接出发的地方。';
  if(word==='回到')return k===0?'“回到”是回到原来的地方，可是旅程才刚开始。':'“回到”是回到原来的地方，这里是第一次来。';
  if(word==='经过')return '“经过”是从旁边路过、不停留。';
  if(word==='穿过')return '“穿过”是从中间通过，课文里没有这样写。';
  if(word==='沿着'||word==='顺着')return '“'+word+'”后面要接一条路线。';
  return '再读一读课文。';
}
function wordsStep(t,k,s,ok){
  add(`<div class="hint">把转换词卡拖进句子的空格（也可以先点词，再点空格）。课文第${s.para}段。</div>`,t);
  let bi=0;
  const sent=add(`<div class="sent">${s.parts.map(p=>p===null?`<button type="button" class="blank open" data-drop="blank" data-i="${bi++}" aria-label="空格${bi}">　</button>`:p).join('')}</div>`,t);
  const tray=add('<div class="chips"></div>',t);
  const blanks=[...sent.querySelectorAll('.blank')];let filled=0,tries=0;
  WORDS.forEach(w=>{const c=add(`<button type="button" class="chip word">${w}</button>`,tray);bindChip(c,w,drop)});
  function drop(word,z){
    if(z.dataset.drop!=='blank'||!z.classList.contains('open')||!sent.contains(z)){if(z.dataset.drop==='slot')fb(t,'bad','转换词要拖进上面句子里的空格。');return}
    const j=+z.dataset.i;const ans=s.ans[j];
    if(word===ans){z.textContent=word;z.classList.remove('open');z.classList.add('right');filled++;
      if(filled===blanks.length){tray.querySelectorAll('.chip').forEach(c=>c.classList.add('used'));t.querySelector('.readlock')?.remove();fb(t,'good','<b>答对了！</b>出发……');ok()}
      else fb(t,'good','对！继续填下一个空格。');return}
    z.textContent=word;z.classList.add('wrong');tries++;miss(k,ST[k].steps.indexOf(s),'ABCDEFG'[WORDS.indexOf(word)]);fb(t,'bad',whyWord(k,j,word,ans));
    setTimeout(()=>{if(z.classList.contains('open')){z.textContent='　';z.classList.remove('wrong')}},900);
    if(tries>=2)readHint(t,[s.para]);
  }
}
