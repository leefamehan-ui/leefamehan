p:balance}\nh1 small{font-size:.55em;color:var(--ink);letter-spacing:1px;margin-left:8px;background:var(--gold-soft);border:2px solid var(--ink);border-radius:999px;padding:1px 12px;vertical-align:middle}\n.store{font-size:13px;color:var(--ink-soft)}\n\n.btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:6px 16px;background:var(--card);cursor:pointer;box-shadow:0 2px 0 var(--ink);font-weight:500;white-space:nowrap}\n.btn:active{transform:translateY(2px);box-shadow:none}\n.btn.main{background:var(--green);color:var(--white)}\n.btn.blue{background:var(--river);color:var(--white)}\n.btn.quiet{box-shadow:none;border-color:var(--line);color:var(--ink-soft);padding:4px 12px;font-size:13px}\n.btn.danger{border-color:var(--red);color:var(--red);box-shadow:none;font-size:13px;padding:4px 12px}\n.btn.danger.armed{background:var(--red);color:var(--white)}\n.btn:disabled{opacity:.5;cursor:not-allowed}\n\n.classes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.cls{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:6px 14px;background:var(--card);cursor:pointer;font-weight:500}\n.cls b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1}\n.cls span{font-size:12px;color:var(--ink-soft)}\n.cls[aria-current=\"true\"]{border-color:var(--ink);background:var(--gold-soft);box-shadow:0 3px 0 var(--ink)}\n.cls.new{border-style:dashed;color:var(--ink-soft)}\n.newform{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px 14px}\n.newform label{font-weight:700}\n.newform input{border:2px solid var(--ink);border-radius:10px;padding:6px 10px;width:12em;max-width:100%;background:var(--white)}\n.newform .hint{flex-basis:100%}\n\n.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}\n@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}\n.col{display:grid;gap:16px;min-width:0}\n.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:14px 16px;min-width:0}\n.card h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n.card h2 .tag{font-family:var(--f-body);font-size:12px;font-weight:700;background:var(--gold-soft);border:1.5px solid var(--gold);color:var(--ink);border-radius:999px;padding:0 10px}\n.hint{font-size:13px;color:var(--ink-soft)}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n\n.link{display:grid;gap:4px;margin-bottom:12px}\n.link label{font-weight:700;font-size:14px}\n.link code{display:block;font-family:var(--f-mono);font-size:12.5px;background:var(--white);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;word-break:break-all;user-select:all}\n.code{font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:1px}\n\ntextarea#paste{width:100%;box-sizing:border-box;min-height:130px;border:2px solid var(--ink);border-radius:12px;padding:10px;background:var(--white);font:13px/1.5 var(--f-mono);resize:vertical}\n.msg{font-size:14px;border-radius:10px;padding:8px 10px;margin-top:8px}\n.msg.good{background:var(--good-bg)} .msg.warn{background:var(--warn-bg)} .msg.bad{background:var(--bad-bg)}\n\n.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}\n@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.tile{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:10px 14px;min-width:0}\n.tile .k{font-size:13px;color:var(--ink-soft)}\n.tile .v{font-family:var(--f-display);font-size:30px;line-height:1.2;font-variant-numeric:tabular-nums}\n.tile .s{font-size:13px;color:var(--ink-soft);overflow-wrap:anywhere}\n\n.scroll{overflow-x:auto}\ntable{border-collapse:collapse;width:100%;font-size:14px}\nth{text-align:left;font-size:12px;color:var(--ink-soft);font-weight:700;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}\ntd{padding:7px 8px;border-bottom:1px dashed var(--line);vertical-align:top}\ntd.num{font-variant-numeric:tabular-nums;white-space:nowrap}\n#qtable{min-width:640px}\n#qtable td:nth-child(2){min-width:9em}\ntr.st td{background:var(--gold-soft);font-weight:700;font-size:13px;border-bottom:none;padding:5px 8px}\ntr.q{cursor:pointer}\ntr.q:hover td{background:#fff3da}\ntr.q.open td{background:#fff3da}\n.qn{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft)}\n.must{font-size:11px;font-weight:700;color:var(--white);background:var(--plum,#8a4fa3);border-radius:6px;padding:0 6px;margin-right:4px}\n.bar{display:flex;align-items:center;gap:8px;min-width:150px}\n.bar i{flex:1;height:10px;border-radius:5px;background:var(--line-soft);position:relative;overflow:hidden}\n.bar i b{position:absolute;inset:0 auto 0 0;border-radius:5px}\n.bar span{font-variant-numeric:tabular-nums;width:3.2em;text-align:right;font-weight:700}\n.lvl-good{background:var(--green)} .lvl-mid{background:var(--orange)} .lvl-low{background:var(--red)}\n.pick{font-size:13px}\n.pick em{font-style:normal;color:var(--red);font-weight:700}\ntr.detail td{background:var(--white);border-bottom:2px solid var(--line)}\n.detail-box{display:grid;gap:6px;font-size:14px;padding:4px 2px}\n.detail-box .ans{background:var(--good-bg);border-radius:8px;padding:4px 8px}\n.chips{display:flex;gap:6px;flex-wrap:wrap}\n.chip{font-size:12.5px;border:1.5px solid var(--line);border-radius:999px;padding:0 9px;background:var(--card)}\n.chip.bad{border-color:var(--red);color:var(--red)}\n\n.heat{display:flex;gap:2px}\n.heat i{width:13px;height:18px;border-radius:3px;display:block}\n.h0{background:#cfe8cd} .h1{background:#f6c58f} .h2{background:#e98d7a}\n.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);align-items:center}\n.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}\n\n.empty{display:grid;gap:10px;justify-items:start}\n.demo-banner{background:var(--warn-bg);border:2px dashed var(--orange);border-radius:14px;padding:8px 14px;font-size:14px}\n\ndetails.key{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px}\ndetails.key[open]{border-color:var(--ink)}\ndetails.key summary{cursor:pointer;font-weight:700}\n.keylist{display:grid;gap:6px;margin:10px 0 4px}\n.keylist div{font-size:14px}\n.keylist .a{color:var(--green);font-weight:700}\n@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}\n.store{font-size:13px;color:var(--ink-soft)}\n.setup .card{max-width:860px}\n.steps{display:grid;gap:12px;padding-left:1.4em;margin:12px 0 16px}\n.steps li{line-height:1.7}\ndetails.code{margin-top:6px}\ndetails.code summary{cursor:pointer;font-size:13px;color:var(--ink-soft)}\ndetails.code pre{max-height:260px;overflow:auto;background:var(--white);border:1.5px solid var(--line);border-radius:10px;padding:10px;font:12px/1.5 var(--f-mono);white-space:pre}\n.setform{display:grid;gap:6px;max-width:560px;background:var(--white);border:2px solid var(--ink);border-radius:14px;padding:14px}\n.setform label{font-weight:700;margin-top:4px}\n.setform input{border:2px solid var(--ink);border-radius:10px;padding:8px 10px;background:var(--white);min-width:0}\n.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}\n@media (max-width:700px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.lane{border:1.5px dashed var(--line);border-radius:12px;padding:6px 8px;min-height:72px;background:var(--white);min-width:0}\n.lane.fin{border:2px solid var(--green);background:var(--good-bg)}\n.lh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}\n.lh b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--ink)}\n.names{display:flex;flex-wrap:wrap;gap:4px}\n.names span{font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 8px}\n.hn{background:#ece6d6}\ndetails.paste{margin-top:10px}\ndetails.paste summary{cursor:pointer;font-size:14px;font-weight:700}\n\n<\/style>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <h1>寻找大师的路线图<small>教师端<\/small><\/h1>\n    <span class=\"store\" id=\"store\"><\/span>\n  <\/header>\n\n  <!-- ========== 平常使用 ========== -->\n  <div id=\"app\">\n    <nav class=\"classes\" id=\"classes\" aria-label=\"班级\"><\/nav>\n    <form class=\"newform\" id=\"newform\" hidden>\n      <label for=\"cname\">新班级名称<\/label>\n      <input id=\"cname\" maxlength=\"16\" placeholder=\"例如 1E2\" autocomplete=\"off\">\n      <button class=\"btn main\" type=\"submit\">生成这一班的链接<\/button>\n      <button class=\"btn quiet\" type=\"button\" id=\"cancelNew\">取消<\/button>\n      <div class=\"hint\">每一班会拿到自己的学生链接，作答分开保存。<\/div>\n    <\/form>\n    <div id=\"noClass\" class=\"card empty\" hidden>\n      <h2>还没有班级<\/h2>\n      <p class=\"hint\">按上面的“＋ 开新一班”，输入班名，就会生成这一班的学生链接。学生做完，作答会自动出现在这里。下面是全部题目的答案。<\/p>\n    <\/div>\n\n    <div class=\"grid\" id=\"main\" hidden>\n      <div class=\"col\">\n        <section class=\"card\">\n          <h2>本班链接<\/h2>\n          <div class=\"link\"><label>学生端（发给学生）<\/label><code id=\"stuLink\"><\/code><div class=\"row\"><button class=\"btn quiet\" type=\"button\" data-copy=\"stuLink\">复制学生链接<\/button><\/div><\/div>\n          <div class=\"link\"><label>教师端（你在别的电脑打开用）<\/label><code id=\"teaLink\"><\/code><div class=\"row\"><button class=\"btn quiet\" type=\"button\" data-copy=\"teaLink\">复制教师链接<\/button><\/div><\/div>\n          <div class=\"hint\">学生打开学生链接，输入名字就出发。学生按“出发”时，名字会出现在“全班进度”；走到终点时，作答会自动交到这里，不用复制。请把教师链接存成书签，下次直接打开。<\/div>\n          <div class=\"hint\" id=\"copyMsg\" aria-live=\"polite\"><\/div>\n        <\/section>\n        <section class=\"card\">\n          <h2>管理<\/h2>\n          <div class=\"row\"><button class=\"btn blue\" type=\"button\" id=\"exportBtn\">复制全班成绩表<\/button><button class=\"btn danger\" type=\"button\" id=\"delClass\">删除这一班<\/button><\/div>\n          <div class=\"hint\" id=\"exportMsg\" aria-live=\"polite\">作答会存在这台电脑的浏览器里。换电脑、或想长期保存，请在下课后按“复制全班成绩表”，贴进 Google Sheets。<\/div>\n          <details class=\"paste\"><summary>补交：有学生没交成功时用<\/summary>\n            <textarea id=\"paste\" placeholder=\"把学生的备用完成码（MR1| 开头）贴在这里，一次贴很多个也可以。\"><\/textarea>\n            <div class=\"row\" style=\"margin-top:8px\"><button class=\"btn main\" type=\"button\" id=\"addBtn\">交进本班<\/button><\/div>\n            <div id=\"addMsg\" aria-live=\"polite\"><\/div>\n          <\/details>\n        <\/section>\n      <\/div>\n\n      <div class=\"col\">\n        <section class=\"card\">\n          <h2>全班进度 <span class=\"tag\" id=\"live\">连接中……<\/span><\/h2>\n          <div class=\"board\" id=\"board\"><\/div>\n        <\/section>\n        <div class=\"tiles\" id=\"tiles\"><\/div>\n        <section class=\"card\">\n          <h2>逐题分析 <span class=\"tag\">点一行看详情<\/span><\/h2>\n          <div class=\"hint\" style=\"margin-bottom:6px\">“一次答对”＝第一次就选对的人数比例，只计算已经做到这一题的学生。红色的题最值得在课堂上讲。<\/div>\n          <div class=\"scroll\"><table id=\"qtable\"><\/table><\/div>\n        <\/section>\n        <section class=\"card\">\n          <h2>学生名单<\/h2>\n          <div class=\"legend\"><span><i class=\"h0\"><\/i>一次答对<\/span><span><i class=\"h1\"><\/i>错 1 次<\/span><span><i class=\"h2\"><\/i>错 2 次以上<\/span><span><i class=\"hn\"><\/i>还没做到<\/span><\/div>\n          <div class=\"scroll\"><table id=\"stable\"><\/table><\/div>\n        <\/section>\n        <details class=\"key\" id=\"keyBox\" open><summary>答案（教师用）<\/summary><div id=\"keyList\"><\/div><\/details>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<script>\n/* 寻找大师的路线图：课文、题目、完成码（学生端和教师端共用） */\n/* ---------- 课文 ---------- */\nconst LESSON=[\n '工艺设计课的老师布置了假期作业，让我们设计一个别具特色的建筑模型。正当我伤脑筋的时候，爸爸故作神秘地说，他可以带我去拜访一位有名的建筑大师，但要走很长一段路。我欣喜万分，满口答应。',\n '爸爸带我来到中央商业区，我们沿着新加坡河漫步。走着走着，爸爸指着不远处一座外观独特的大楼问我：“那座大楼的外观像一个汉字，你能看出是什么字吗？”我绞尽脑汁，还是想不到。爸爸得意地说：“是繁体字‘貝’。古时候人们曾经把贝壳当作钱来使用，所以用‘贝’做偏旁的字，很多都跟钱财有关。你知道吗？这座楼就是华侨银行大楼。”“贝”代表钱，银行不就是与钱打交道吗？想到这里，我由衷佩服设计师的巧思。不过，建筑大师该不会住在银行大楼里吧？爸爸似乎看出我的疑惑，笑着说：“别急，我们先去来福士城吃午餐。”',\n '我们沿着桥北路走，不久就看到远处的来福士城大楼。这座楼从一面看是个圆柱体，从另一面看又是个长方体，别具一格。吃完午餐，爸爸还要走一走。',\n '我们离开来福士城，顺着美芝路来到新门广场。这里有两座摩天大楼，好像两扇打开的大门。大楼的形状独树一帜，看上去就像薄薄的刀片一样。爸爸说，有人认为大楼设计成这种形状，有消除灾祸的用意。虽然这只是传言，却让我对建筑设计产生了更多的好奇心。',\n '我问爸爸那位建筑大师住在哪里，他却说：“你已经见过他了，他就是贝聿铭先生。这三座建筑都是他设计的。”我这才恍然大悟，原来爸爸是希望我从这位大师的建筑中获得设计的灵感。',\n '回到家后，通过查找资料，我对贝聿铭先生有了更多的了解。他是一名建筑设计大师，他的很多建筑今天都已经成为知名的地标，但有些却曾受尽批评。例如，他为法国卢浮宫设计的玻璃金字塔，这一建筑造型大胆独特，遭到了很多人的质疑和抨击。面对挫折，他这样说：“我和我的建筑都像竹子，再大的风雨也只是弯弯腰而已。”',\n '这次的建筑之旅，不但让我对新加坡的建筑有了新的认识，也让我从这位建筑大师身上学到很多。'];\n\nconst PLACES=['中央商业区','华侨银行大楼','来福士城','新门广场','家'];\nconst CARDS=['来福士城','滨海湾金沙','家','中央商业区','新门广场','华侨银行大楼'];\nconst NAMES=['起点','第1站','第2站','第3站','终点'];\nconst WORDS=['沿着','顺着','离开','来到','回到','经过','穿过'];\n\n/* ---------- 题目 ----------\n   step 类型：place 拖地点｜words 拖转换词｜mcq 选择题｜msq 多选｜viewer 转动观察 */\nconst ST=[\n {para:[1,2],say:'出发！',steps:[\n  {type:'place'},\n  {type:'words',title:'怎么到这里？',parts:['爸爸带我',null,'中央商业区。'],ans:['来到'],para:2},\n  {type:'mcq',title:'为什么出发？',q:'爸爸为什么要带“我”走这么长的一段路？',para:[1],opts:[\n    ['去中央商业区逛逛新大楼，顺便替“我”买些文具','回第1段看看：爸爸说要带“我”去拜访谁？'],\n    ['拜访一位有名的建筑大师，帮“我”找设计作业的灵感',1],\n    ['带“我”去银行办点事，让“我”认识新加坡的金融区','银行只是路上经过的第一站，不是出发的目的。']]},\n  {type:'mcq',title:'出发时的心情',q:'听到要去拜访建筑大师，“我”的心情怎样？',para:[1],opts:[\n    ['伤脑筋','这是“我”想不出作业时的样子。听到爸爸的提议后呢？'],\n    ['恍然大悟','这是第5段，大师揭晓时的心情。'],\n    ['欣喜万分',1]]}]},\n {para:[2],say:'这座楼好特别！',steps:[\n  {type:'place'},\n  {type:'words',title:'怎么走到这里？',parts:['我们',null,'新加坡河漫步。'],ans:['沿着'],sign:'沿着',para:2},\n  {type:'mcq',title:'看到什么①',log:'see',show:'外观像繁体字“貝”',q:'爸爸说，这座大楼的外观像一个汉字。是哪个字？',para:[2],opts:[\n    ['汉字“目”','只看到了上半部分，大楼下面还有两条“腿”。'],\n    ['繁体字“貝”',1],\n    ['繁体字“門”','像两扇打开的大门的，是第3站新门广场。']]},\n  {type:'mcq',title:'看到什么②',q:'为什么银行大楼要设计成“貝”字的样子？',para:[2],opts:[\n    ['古时候用贝壳当钱，“贝”字旁的字多和钱财有关，正好配银行',1],\n    ['新加坡河里曾有很多贝壳，大楼建在河边，用来纪念这段历史','课文没有提到河里的贝壳。读读爸爸的解释。'],\n    ['“貝”字笔画多、左右对称，盖成大楼看起来特别稳重气派','笔画和对称都不是原因。读读爸爸的解释。']]},\n  {type:'mcq',title:'想到什么',log:'feel',pin:1,show:'由衷佩服设计师的巧思，又疑惑大师会不会住在这里',q:'想到这里，“我”有什么想法？',para:[2],opts:[\n    ['觉得大楼外形太奇怪，怀疑设计师是不是在跟大家开玩笑','课文说“我”由衷佩服设计师的巧思。'],\n    ['恍然大悟，原来要拜访的大师就是这座银行大楼的主人','这时还没揭晓大师是谁，那是第5段的事。'],\n    ['由衷佩服设计师的巧思，又疑惑大师会不会住在这里',1]]},\n  {type:'mcq',must:'过渡句',q:'离开前，爸爸笑着说：“别急，我们先去来福士城吃午餐。”这句话有什么作用？',para:[2,3],opts:[\n    ['交代地点：告诉读者他们中午要去哪里吃午餐','吃饭只是表面。想一想：这句话让文章从哪里转到哪里？'],\n    ['承上启下：结束这一站，把读者自然地带向下一站',1],\n    ['描写人物：说明爸爸做事不慌不忙，很有耐心','“别急”只是顺口一说。想想这句话之后，地点有没有变？']],\n    explain:'这是<b>过渡句<\/b>。人还没走，就先预告下一站，读者不会突然“被换到”另一个地方。'}]},\n {para:[3],say:'看到了！',steps:[\n  {type:'place'},\n  {type:'words',title:'怎么走到这里？',parts:['我们',null,'桥北路走，不久就看到远处的来福士城大楼。'],ans:['沿着'],sign:'沿着',para:3},\n  {type:'viewer',title:'看到什么：绕着大楼走一圈'},\n  {type:'mcq',title:'看到什么①',q:'站在<b>弧形<\/b>的那一面看，来福士城像什么形状？',para:[3],opts:[\n    ['长方体','再转到弧形那一面看看。'],['圆柱体',1],['三棱柱','三棱柱的面都是平的，弧形那一面不是。']]},\n  {type:'mcq',title:'看到什么②',log:'see',show:'一面看是圆柱体，另一面看是长方体',q:'站在<b>平直<\/b>的那一面看，来福士城又像什么形状？',para:[3],opts:[\n    ['长方体',1],['圆柱体','再转到平直那一面看看。'],['圆锥体','圆锥体的顶是尖的。']],\n    explain:'课文第3段：“这座楼从一面看是个圆柱体，从另一面看又是个长方体。”换一个位置看，看到的就不一样。'},\n  {type:'mcq',title:'想到什么',log:'feel',pin:2,show:'很欣赏这座楼（别具一格）',q:'这一段没有直接写“我”的感受。从哪个词可以看出“我”很欣赏这座楼？',para:[3],opts:[\n    ['别具一格',1],['独树一帜','这个词在第4段，形容新门广场。'],['绞尽脑汁','这是第2段“我”在猜字的样子。']]},\n  {type:'mcq',must:'详略',q:'第2段写华侨银行大楼用了243个字，第3段写来福士城只用了67个字。两座都是贝聿铭设计的，为什么一详一略？',para:[2,3,5],opts:[\n    ['来福士城不是贝聿铭设计的，作者只是吃午餐时顺路经过，所以三言两语带过就够了','第5段爸爸说：“这三座建筑都是他设计的。”来福士城也是大师的作品。'],\n    ['第一站要靠猜字对话带出“大师在哪里”的疑问；来福士城抓住“两面形状不同”就写清楚了',1],\n    ['华侨银行大楼比来福士城更高、更有名，也更受游客欢迎，所以作者要花更多笔墨来详细介绍','课文没有比较两座楼的高矮和名气。详写还是略写，要看这一段在文章里要完成什么任务。']],\n    explain:'两座楼都是大师的作品，也都是爸爸要带“我”看的。不同的是写作上的<b>任务<\/b>：华侨银行大楼是第一站，作者要用猜字的对话、“貝”字的含义，带出“大师在哪里？”的疑问，所以<b>详写<\/b>；来福士城的特点（一面是圆柱体，一面是长方体）一两句就能写清楚，抓住这个特点、点出“别具一格”就够了，所以<b>略写<\/b>。详写还是略写，不是看哪座楼更重要，而是看这一段要完成什么任务。'}]},\n {para:[4,5],say:'好高的楼！',steps:[\n  {type:'place'},\n  {type:'words',title:'怎么走到这里？',parts:['我们',null,'来福士城，',null,'美芝路',null,'新门广场。'],ans:['离开','顺着','来到'],sign:'离开·顺着·来到',para:4},\n  {type:'msq',title:'看到什么①',log:'see',show:'两座摩天大楼像两扇打开的大门，又像薄薄的刀片',q:'作者用了哪<b>两个<\/b>比喻来写这两座摩天大楼？（选两个）',para:[4],need:2,opts:[\n    ['像两扇打开的大门',1],['像两颗榴莲','这是导入时看到的滨海艺术中心。'],['像薄薄的刀片',1],['像繁体字“貝”','这是第1站华侨银行大楼。']]},\n  {type:'mcq',title:'看到什么②',q:'爸爸说，有人认为大楼设计成这种形状，有什么用意？',para:[4],opts:[\n    ['招财进宝','和钱财有关的是华侨银行大楼。'],['挡风遮雨','课文没有这样说。'],['消除灾祸',1]]},\n  {type:'mcq',title:'作者的态度',q:'“虽然这只是传言，却让我对建筑设计产生了更多的好奇心。”作者对这个传言的态度是什么？',para:[4],opts:[\n    ['完全相信，觉得大楼真的能替这一带消除灾祸','“虽然这只是传言”，说明作者并不当真。'],\n    ['不一定相信，但它引起了“我”对建筑设计的好奇',1],\n    ['觉得传言很可笑，认为建筑设计和传言毫无关系','课文没有嘲笑的意思，反而让“我”更好奇。']]},\n  {type:'mcq',title:'想到什么',log:'feel',pin:3,show:'对建筑设计更好奇；知道大师是谁后，恍然大悟',q:'在新门广场，“我”的心情有什么变化？',para:[4,5],opts:[\n    ['先是由衷佩服，后来觉得大楼像刀片太危险，感到害怕','课文没有写害怕；传言反而让“我”更好奇。'],\n    ['先是更加好奇，知道大师是谁后，恍然大悟',1],\n    ['一直很平静，因为这只是一个传言，“我”并不在意','第5段“恍然大悟”，心情有很大的变化。']]},\n  {type:'mcq',must:'悬念',q:'第1段就说要拜访建筑大师，为什么到了这一站（第5段）才说出大师是谁？',para:[2,5],opts:[\n    ['作者一开始忘了交代，写到最后才补上大师是谁，让文章完整','这是作者故意的安排。想想“我”一路上心里在问什么。'],\n    ['制造悬念：带着“大师在哪里”的疑问一站站走，揭晓时印象更深',1],\n    ['交代顺序：大师就住在新门广场，要一直走到这里才能见到他本人','课文说的是“你已经见过他了”，三座建筑都是他设计的。']],\n    explain:'这就是<b>悬念<\/b>。疑问在华侨银行大楼出现，到新门广场才解开。'}]},\n {para:[6,7],say:'到家啦！',steps:[\n  {type:'place'},\n  {type:'words',title:'怎么回到这里？',parts:[null,'家后，通过查找资料，我对贝聿铭先生有了更多的了解。'],ans:['回到'],sign:'回到',para:6},\n  {type:'mcq',title:'看到什么①',log:'see',show:'玻璃金字塔造型大胆独特，曾受到批评',q:'“我”查资料知道，贝聿铭为法国卢浮宫设计的玻璃金字塔，为什么遭到很多人的质疑和抨击？',para:[6],opts:[\n    ['建造时间太长','课文没有提到建造时间。'],['造型大胆独特',1],['用了太多竹子','竹子是名言里的比喻，不是建筑材料。']]},\n  {type:'mcq',must:'人物精神',q:'“我和我的建筑都像竹子，再大的风雨也只是弯弯腰而已。”这句话让“我”学到了什么？',para:[6],opts:[\n    ['盖房子最好用竹子，因为竹子轻巧，又不怕风吹雨打','这是比喻，不是说真的用竹子盖房子。'],\n    ['面对批评和挫折，要像竹子一样坚韧，不被打倒',1],\n    ['遇到大风大雨时，要懂得弯下腰来保护好自己','“风雨”比喻的是批评和挫折，不是真的天气。']],\n    explain:'“风雨”比喻批评和挫折。“我”不但认识了建筑，也学到了大师坚韧不屈的精神。'},\n  {type:'mcq',title:'想到什么',log:'feel',pin:4,show:'对新加坡的建筑有新认识，也从大师身上学到很多',q:'这次旅程，“我”有什么收获？',para:[7],opts:[\n    ['走了一整天觉得很累，以后不想再去参观建筑了','课文没有这样写。看看第7段。'],\n    ['对新加坡的建筑有了新的认识，也从大师身上学到很多',1],\n    ['觉得设计作业太难了，决定回家请爸爸帮忙完成','刚好相反，“我”从大师的建筑中获得了灵感。']]}]}];\n\nconst SECRETS=[\n {name:'路线要清楚',full:'用转换词和过渡句带路',from:'华侨银行大楼的过渡句'},\n {name:'详略有安排',full:'要展开故事、带出疑问的地方详写；抓住一个特点就能写清楚的地方略写',from:'华侨银行大楼和来福士城的详略'},\n {name:'所见 + 所感',full:'每到一站，说出看到什么，也说出想到什么',from:'每一站的看到、想到'},\n {name:'留一个悬念',full:'留一个疑问，吸引游客跟着走下去',from:'新门广场的悬念'}];\n\n\n/* ---------- 正确答案的位置：分散在 A、B、C（D），不要都是同一个字母 ---------- */\nconst ANSWER_AT={'0.2':'A','0.3':'C','1.2':'A','1.3':'B','1.4':'C','1.5':'A','2.3':'B','2.4':'C','2.5':'B','2.6':'C',\n  '3.2':'BD','3.3':'A','3.4':'B','3.5':'C','3.6':'A','4.2':'B','4.3':'C','4.4':'A'};\nST.forEach((st,k)=>st.steps.forEach((s,i)=>{\n  const want=ANSWER_AT[k+'.'+i];if(!want||!s.opts)return;\n  const right=s.opts.filter(o=>o[1]===1),wrong=s.opts.filter(o=>o[1]!==1);\n  const out=[];let r=0,w=0;\n  for(let j=0;j<s.opts.length;j++)out.push(want.includes('ABCD'[j])?right[r++]:wrong[w++]);\n  s.opts=out;\n}));\n\n/* ---------- 完成码（学生端生成，教师端读取） ----------\n   MR1|班级码|姓名|用时秒|每题记录|校验\n   每题记录：错误次数 + 误选字母（选择题=选项 A-D；地点=地点卡；转换词=词卡），用 . 隔开 */\nconst QLIST=[];\nST.forEach((st,k)=>st.steps.forEach((s,i)=>{if(s.type!=='viewer')QLIST.push({k,i,s})}));\nconst CODE_RE=/MR1\\|([^|\\n]*)\\|([^|\\n]*)\\|(\\d{1,6})\\|([0-9A-Z.]+)\\|([0-9A-Z]{2})/g;\nfunction codeSum(t){let h=7;for(const ch of t)h=(h*31+ch.codePointAt(0))%1296;return h.toString(36).toUpperCase().padStart(2,'0')}\nfunction makeCode(cls,name,secs,rec){\n  const items=QLIST.map(q=>{const r=rec[q.k+'.'+q.i]||{n:0,p:''};return Math.min(9,r.n)+r.p}).join('.');\n  const body=`MR1|${(cls||'-').replace(/[|\\n]/g,'')}|${String(name).replace(/[|\\n]/g,'').trim()}|${secs}|${items}`;\n  return body+'|'+codeSum(body);\n}\nfunction readCodes(text){\n  const out=[];let m;CODE_RE.lastIndex=0;\n  while((m=CODE_RE.exec(text))){\n    const body=m[0].slice(0,m[0].length-3);\n    if(codeSum(body)!==m[5]){out.push({bad:true,raw:m[0]});continue}\n    const it=m[4].split('.');\n    if(it.length!==QLIST.length){out.push({bad:true,raw:m[0]});continue}\n    out.push({cls:m[1],name:m[2],secs:+m[3],items:it.map(x=>({n:+x[0],p:x.slice(1)}))});\n  }\n  return out;\n}\nconst CLASS_RE=/^[A-Za-z0-9][A-Za-z0-9._~-]{1,39}$/;\n\n<\/script>\n<script>\n/* 学生端 → 教师端：经免费转发服务 ntfy.sh 传送，内容先用链接里的密钥加密（AES-GCM），转发服务看不到名字和作答 */\nconst RELAY_HOST='https://ntfy.sh/';\nconst B64U={\n  enc:buf=>{let s='';new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\\+/g,'-').replace(/\\//g,'_').replace(/=+$/,'')},\n  dec:s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0))\n};\nconst ROOM_RE=/^[A-Za-z0-9_-]{16,64}$/, KEY_RE=/^[A-Za-z0-9_-]{22}$/;\nfunction randToken(n){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';let r='';for(const x of crypto.getRandomValues(new Uint32Array(n)))r+=A[x%A.length];return r}\nfunction newKey(){return B64U.enc(crypto.getRandomValues(new Uint8Array(16)))}\nconst _keys={};\nfunction aesKey(k){return _keys[k]||(_keys[k]=crypto.subtle.importKey('raw',B64U.dec(k),'AES-GCM',false,['encrypt','decrypt']))}\nasync function seal(k,text){\n  const iv=crypto.getRandomValues(new Uint8Array(12));\n  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(k),new TextEncoder().encode(text)));\n  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);\n  return 'MRX1.'+B64U.enc(out);\n}\nasync function unseal(k,s){\n  if(typeof s!=='string'||!s.startsWith('MRX1.'))return null;\n  try{const b=B64U.dec(s.slice(5));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},await aesKey(k),b.slice(12));return JSON.parse(new TextDecoder().decode(pt))}catch(e){return null}\n}\n\n<\/script>\n<script>\n/* 寻找大师的路线图 · 教师端（单一文件版：经 ntfy.sh 即时接收，存在这台电脑） */\nconst $=s=>document.querySelector(s);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst strip=s=>String(s).replace(/<[^>]+>/g,'');\nconst STN=['起点','第1站','第2站','第3站','终点'];\nconst TOP=(()=>{try{return window.parent.location}catch(e){return location}})();\nconst BASE=TOP.href.split('#')[0];\n\n/* ---------- 题目信息 ---------- */\nconst Q=QLIST.map((q,j)=>{\n  const {k,s}=q;let label,full,answer,pickText;\n  if(s.type==='place'){label='这一站是哪里？';full=`拖地点卡：${STN[k]}是哪里？`;answer=PLACES[k];pickText=L=>CARDS['ABCDEF'.indexOf(L)]}\n  else if(s.type==='words'){label='怎么到这里？（转换词）';let b=0;full=s.parts.map(p=>p===null?'____':p).join('');answer=s.parts.map(p=>p===null?`【${s.ans[b++]}】`:p).join('');pickText=L=>WORDS['ABCDEFG'.indexOf(L)]}\n  else{label=s.must?s.must:s.title;full=strip(s.q);answer=s.opts.map((o,i)=>o[1]===1?'ABCD'[i]+'. '+o[0]:'').filter(Boolean).join(' ＋ ');pickText=L=>{const o=s.opts['ABCD'.indexOf(L)];return o?L+'. '+o[0]:''}}\n  return {j,k,s,must:!!s.must,label,full,answer,pickText,explain:s.explain?strip(s.explain):''};\n});\n\n/* ---------- 本机保存 ---------- */\nconst LKEY='mr-one-classes';\nlet CLASSES=(()=>{try{return JSON.parse(localStorage.getItem(LKEY)||'[]')}catch(e){return []}})();\nlet SAVED=true;\nfunction save(){try{localStorage.setItem(LKEY,JSON.stringify(CLASSES));SAVED=true}catch(e){SAVED=false}}\nlet CUR=null;\nfunction cls(){return CLASSES.find(c=>c.code===CUR)||null}\nfunction rowsOf(c){return c?Object.values(c.rows||{}).filter(r=>!(c.removed||[]).includes(r.sid)):[]}\nfunction storeNote(t,bad){const e=$('#store');e.textContent=t;e.style.color=bad?'var(--red)':''}\n\n/* 教师链接带着班级：#teacher&c=…&r=…&k=…&n=班名 —— 在别的电脑打开也能接上 */\n(()=>{\n  try{\n    const p=new URLSearchParams(TOP.hash.slice(1).replace(/^teacher&?/,''));\n    const code=p.get('c')||'',r=p.get('r')||'',k=p.get('k')||'';\n    if(CLASS_RE.test(code)&&ROOM_RE.test(r)&&KEY_RE.test(k)){\n      if(!CLASSES.some(c=>c.code===code)){CLASSES.push({code,name:p.get('n')||code.replace(/-[A-Z0-9]{4}$/,''),room:r,key:k,created:Date.now(),rows:{},removed:[]});save()}\n      CUR=code;\n    }\n  }catch(e){}\n})();\n\n/* ---------- 接收 ---------- */\nlet ES=null,pollT=null,lastMsg=0,connected=false;\nfunction listen(){\n  if(ES){ES.close();ES=null}clearInterval(pollT);connected=false;\n  const c=cls();if(!c){$('#live').textContent='';return}\n  setLive('连接中……');\n  const handle=async raw=>{\n    let m;try{m=typeof raw==='string'?JSON.parse(raw):raw}catch(e){return}\n    if(!m||m.event!=='message'||!m.message)return;\n    const d=await unseal(c.key,m.message);\n    if(!d||typeof d.sid!=='string'||!/^[A-Za-z0-9_-]{6,80}$/.test(d.sid))return;\n    const old=c.rows[d.sid];\n    if(old&&(old.ts||0)>=(d.ts||0))return;\n    c.rows[d.sid]={sid:d.sid,n:String(d.name||'').slice(0,16),st:Math.max(0,Math.min(5,+d.st||0)),t:Math.max(0,+d.secs||0),it:/^[0-9A-Z.\\-]{1,300}$/.test(d.it||'')?d.it:'',done:!!d.done,ts:+d.ts||Date.now(),cls:String(d.cls||'')};\n    lastMsg=Date.now();save();\n    if(c.code===CUR)scheduleRender();\n  };\n  try{\n    ES=new EventSource(`${RELAY_HOST}${c.room}/sse?since=all`);\n    ES.onopen=()=>{connected=true;setLive('已连上 · 学生交来会马上出现')};\n    ES.onmessage=e=>handle(e.data);\n    ES.onerror=()=>{connected=false;setLive('连接中断，正在重连……',true)};\n  }catch(e){ES=null}\n  /* 后备：每 20 秒补读一次 */\n  const poll=async()=>{\n    try{const r=await fetch(`${RELAY_HOST}${c.room}/json?poll=1&since=all`);if(!r.ok)throw 0;\n      const t=await r.text();for(const line of t.split('\\n'))if(line.trim())await handle(line);\n      if(!connected)setLive('已连上（每 20 秒更新）');}\n    catch(e){if(!connected)setLive('连不上转发服务。请检查网络；学校网络可能封锁了 ntfy.sh。',true)}\n  };\n  poll();pollT=setInterval(()=>{if(!document.hidden)poll()},20000);\n}\nfunction setLive(t,bad){const e=$('#live');if(!e)return;e.textContent=t;e.style.background=bad?'var(--bad-bg)':'';e.style.borderColor=bad?'var(--red)':''}\nlet rT=null;function scheduleRender(){clearTimeout(rT);rT=setTimeout(renderAll,250)}\n\n/* ---------- 班级 ---------- */\nfunction links(c){\n  const h=`c=${encodeURIComponent(c.code)}&r=${c.room}&k=${c.key}`;\n  return {stu:`${BASE}#${h}`,tea:`${BASE}#teacher&${h}&n=${encodeURIComponent(c.name)}`};\n}\nfunction renderClasses(){\n  $('#classes').innerHTML=CLASSES.map(c=>`<button type=\"button\" class=\"cls\" data-cls=\"${esc(c.code)}\" aria-current=\"${c.code===CUR}\"><b>${esc(c.name)}<\/b><span>${rowsOf(c).length} 人<\/span><\/button>`).join('')\n    +`<button type=\"button\" class=\"cls new\" id=\"newBtn\">＋ 开新一班<\/button>`;\n  const c=cls();\n  $('#noClass').hidden=!!c;$('#main').hidden=!c;\n  const key=$('#keyBox');\n  if(!c){$('#noClass').appendChild(key);key.open=true}else if(key.parentElement.id==='noClass'){$('#main .col:last-child').appendChild(key);key.open=false}\n  if(!c)return;\n  const L=links(c);$('#stuLink').textContent=L.stu;$('#teaLink').textContent=L.tea;\n}\ndocument.addEventListener('click',e=>{\n  const b=e.target.closest('[data-cls]');\n  if(b){CUR=b.dataset.cls;OPEN=null;renderClasses();renderAll();listen();return}\n  if(e.target.closest('#newBtn')){$('#newform').hidden=false;$('#cname').focus()}\n});\nfunction newCode(name){\n  const base=(name.toUpperCase().replace(/[^A-Z0-9]/g,'')||'CLASS').slice(0,8);\n  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let r='';for(const x of crypto.getRandomValues(new Uint32Array(4)))r+=A[x%A.length];\n  return base+'-'+r;\n}\n$('#newform').addEventListener('submit',e=>{\n  e.preventDefault();const name=$('#cname').value.trim();if(!name){$('#cname').focus();return}\n  const c={code:newCode(name),name,room:'mr'+randToken(22),key:newKey(),created:Date.now(),rows:{},removed:[]};\n  CLASSES.push(c);save();CUR=c.code;\n  $('#newform').hidden=true;$('#cname').value='';\n  renderClasses();renderAll();listen();\n  $('#copyMsg').textContent='已生成！把学生链接发给 '+name+' 的学生。';\n});\n$('#cancelNew').onclick=()=>{$('#newform').hidden=true};\n\n/* ---------- 补交完成码 ---------- */\nfunction hashId(t){let h=5381;for(const ch of t)h=((h*33)^ch.codePointAt(0))>>>0;return 'code-'+h.toString(36)}\n$('#addBtn').onclick=()=>{\n  const box=$('#addMsg'),c=cls();if(!c)return;\n  const rs=readCodes($('#paste').value),good=rs.filter(r=>!r.bad),bad=rs.length-good.length;\n  if(!rs.length){box.innerHTML='<div class=\"msg bad\">没有找到完成码。完成码以 <b>MR1|<\/b> 开头，请整串复制。<\/div>';return}\n  good.forEach(r=>{const sid=hashId(c.code+'|'+r.name);c.rows[sid]={sid,n:r.name,st:5,t:r.secs,it:r.items.map(x=>x.n+x.p).join('.'),done:true,ts:Date.now(),cls:c.code}});\n  save();\n  box.innerHTML=`<div class=\"msg good\">交进 ${esc(c.name)}：${good.length} 位。<\/div>`+(bad?`<div class=\"msg bad\">有 ${bad} 个完成码不完整，请那几位学生重新复制。<\/div>`:'');\n  if(!bad)$('#paste').value='';\n  renderClasses();renderAll();\n};\n\n/* ---------- 复制、导出、删除 ---------- */\nfunction copy(text,msgEl,ok,fallbackEl){\n  const fall=()=>{msgEl.textContent='没办法自动复制，已帮你选取文字，请按 Ctrl+C。';if(fallbackEl){const r=document.createRange();r.selectNodeContents(fallbackEl);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}};\n  try{navigator.clipboard.writeText(text).then(()=>msgEl.textContent=ok,fall)}catch(e){fall()}\n}\ndocument.addEventListener('click',e=>{\n  const b=e.target.closest('[data-copy]');if(!b)return;\n  const el=document.getElementById(b.dataset.copy);copy(el.textContent,$('#copyMsg'),'已复制链接。',el);\n});\n$('#exportBtn').onclick=()=>{\n  const R=rowsOf(cls());\n  const head=['姓名','完成','用时(秒)','一次答对题数','总错次',...Q.map(q=>`Q${q.j+1} ${STN[q.k]} ${q.label}`)];\n  const rows=R.map(s=>{const it=items(s);return [s.n,s.done?'是':'否',s.t,it.filter(x=>x&&x.n===0).length,it.reduce((a,x)=>a+(x?x.n:0),0),...it.map(x=>x?x.n:'')]});\n  copy([head,...rows].map(r=>r.join('\\t')).join('\\n'),$('#exportMsg'),`已复制 ${R.length} 位学生的成绩表，可以贴进 Google Sheets。`);\n};\nlet armTimer;\n$('#delClass').onclick=e=>{\n  const b=e.currentTarget,c=cls();if(!c)return;\n  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='再按一次，确定删除 '+c.name;clearTimeout(armTimer);armTimer=setTimeout(()=>{b.classList.remove('armed');b.textContent='删除这一班'},4000);return}\n  b.classList.remove('armed');b.textContent='删除这一班';\n  CLASSES=CLASSES.filter(x=>x.code!==c.code);save();\n  CUR=CLASSES.length?CLASSES[CLASSES.length-1].code:null;renderClasses();renderAll();listen();\n};\n\n/* ---------- 计算 ---------- */\nfunction items(s){return String(s.it||'').split('.').map(t=>t==='-'||t===''?null:{n:+t[0],p:t.slice(1)})}\nfunction stats(R){\n  const S=R.map(items);\n  return Q.map(q=>{\n    let n=0,first=0,erred=[],picks={};\n    S.forEach((it,si)=>{const x=it[q.j];if(!x)return;n++;if(x.n===0)first++;else erred.push(R[si].n);for(const L of x.p)picks[L]=(picks[L]||0)+1});\n    return {q,n,rate:n?first/n:0,erred,picks:Object.entries(picks).sort((a,b)=>b[1]-a[1])};\n  });\n}\nconst lvl=r=>r>=.8?'lvl-good':r>=.6?'lvl-mid':'lvl-low';\nconst pct=r=>Math.round(r*100)+'%';\nconst fmtT=s=>`${Math.floor(s/60)}分${String(s%60).padStart(2,'0')}秒`;\n\n/* ---------- 画面 ---------- */\nfunction renderAll(){\n  const c=cls();if(!c)return;const R=rowsOf(c);\n  renderBoard(R);renderTiles(R);renderQ(R);renderStudents(R);\n  $('#classes [aria-current=\"true\"] span')&&($('#classes [aria-current=\"true\"] span').textContent=R.length+' 人');\n  if(!SAVED)storeNote('这台电脑的浏览器存不了资料，请下课前复制成绩表。',true);\n}\nfunction renderBoard(R){\n  const go=R.filter(r=>!r.done),fin=R.filter(r=>r.done);\n  const lane=(t,arr,cl)=>`<div class=\"lane ${cl}\"><div class=\"lh\">${t}<b>${arr.length}<\/b><\/div><div class=\"names\">${arr.sort((a,b)=>a.n.localeCompare(b.n,'zh')).map(r=>`<span>${esc(r.n)}<\/span>`).join('')}<\/div><\/div>`;\n  $('#board').innerHTML=R.length?lane('已出发，还在路上',go,'')+lane('已完成',fin,'fin')\n    :'<div class=\"hint\">还没有学生出发。学生在学生链接输入名字、按“出发”后，名字会出现在这里。<\/div>';\n}\nfunction renderTiles(R){\n  const n=R.length,done=R.filter(r=>r.done);\n  if(!done.length){$('#tiles').innerHTML='';return}\n  const st=stats(R).filter(x=>x.n>0);\n  const all=st.reduce((a,x)=>a+x.rate,0)/st.length;\n  const minN=Math.max(1,Math.ceil(done.length*.3));\n  const hard=st.filter(x=>x.n>=minN).sort((a,b)=>a.rate-b.rate)[0];\n  const avgT=Math.round(done.reduce((a,s)=>a+s.t,0)/done.length);\n  const tot=R.map(s=>items(s).reduce((a,x)=>a+(x?x.n:0),0));\n  const help=R.filter((s,i)=>tot[i]>=6);\n  $('#tiles').innerHTML=[\n    ['已完成',`${done.length} / ${n} 人`,`${n-done.length} 人还在路上`],\n    ['平均用时',fmtT(avgT),'只算已完成的学生'],\n    ['全班一次答对',pct(all),'已交的作答平均'],\n    ['最需要讲',hard?pct(hard.rate):'—',hard?`Q${hard.q.j+1} ${hard.q.label}`:'']\n  ].map(([k,v,s])=>`<div class=\"tile\"><div class=\"k\">${k}<\/div><div class=\"v\">${esc(v)}<\/div><div class=\"s\">${esc(s)}<\/div><\/div>`).join('')\n  +(help.length?`<div class=\"tile\" style=\"grid-column:1/-1;background:var(--warn-bg)\"><div class=\"k\">可能需要个别辅导<\/div><div class=\"s\" style=\"color:var(--ink)\">${help.map(s=>esc(s.n)).join('、')}（全部题目合计错 6 次以上）<\/div><\/div>`:'');\n}\nlet OPEN=null;\nfunction renderQ(R){\n  const st=stats(R);let html='<thead><tr><th>题<\/th><th>题目<\/th><th>一次答对<\/th><th>错的人数<\/th><th>最多人误选<\/th><\/tr><\/thead><tbody>';\n  let lastK=-1;\n  st.forEach(x=>{const q=x.q;\n    if(q.k!==lastK){lastK=q.k;html+=`<tr class=\"st\"><td colspan=\"5\">${STN[q.k]} · ${PLACES[q.k]}<\/td><\/tr>`}\n    const tp=x.picks[0];\n    html+=`<tr class=\"q ${OPEN===q.j?'open':''}\" data-q=\"${q.j}\" tabindex=\"0\"><td class=\"qn\">Q${q.j+1}<\/td><td>${q.must?'<span class=\"must\">必答<\/span>':''}${esc(q.label)}<\/td>\n      <td>${x.n?`<div class=\"bar\"><i><b class=\"${lvl(x.rate)}\" style=\"width:${pct(x.rate)}\"><\/b><\/i><span>${pct(x.rate)}<\/span><\/div>`:'<span class=\"hint\">还没有人交<\/span>'}<\/td>\n      <td class=\"num\">${x.n?x.erred.length+' / '+x.n+' 人':''}<\/td>\n      <td class=\"pick\">${tp?`<em>${tp[1]} 人<\/em> ${esc(q.pickText(tp[0])||'')}`:''}<\/td><\/tr>`;\n    if(OPEN===q.j){\n      html+=`<tr class=\"detail\"><td colspan=\"5\"><div class=\"detail-box\">\n        <div><b>题目：<\/b>${esc(q.full)}<\/div>\n        <div class=\"ans\"><b>答案：<\/b>${esc(q.answer)}<\/div>\n        ${q.explain?`<div class=\"hint\">${esc(q.explain)}<\/div>`:''}\n        ${x.picks.length?`<div><b>误选情况：<\/b><div class=\"chips\">${x.picks.map(([L,m])=>`<span class=\"chip bad\">${esc(q.pickText(L)||L)} · ${m} 人<\/span>`).join('')}<\/div><\/div>`:''}\n        ${x.erred.length?`<div><b>错过的学生：<\/b><div class=\"chips\">${x.erred.map(n=>`<span class=\"chip\">${esc(n)}<\/span>`).join('')}<\/div><\/div>`:(x.n?'<div>交来的学生都一次答对。<\/div>':'')}\n      <\/div><\/td><\/tr>`;\n    }\n  });\n  $('#qtable').innerHTML=html+'<\/tbody>';\n}\nfunction toggleQ(j){OPEN=OPEN===j?null:j;renderQ(rowsOf(cls()));const r=$(`#qtable tr.q[data-q=\"${j}\"]`);r&&r.focus()}\n$('#qtable').addEventListener('click',e=>{const r=e.target.closest('tr.q');if(r)toggleQ(+r.dataset.q)});\n$('#qtable').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const r=e.target.closest('tr.q');if(!r)return;e.preventDefault();toggleQ(+r.dataset.q)});\n\nlet SORT='name';\nfunction renderStudents(R){\n  if(!R.length){$('#stable').innerHTML='<tbody><tr><td class=\"hint\">学生交来后，这里会列出每位学生每一题的情况。<\/td><\/tr><\/tbody>';return}\n  const rows=R.map(s=>{const it=items(s);return {s,it,first:it.filter(x=>x&&x.n===0).length,done:it.filter(Boolean).length,err:it.reduce((a,x)=>a+(x?x.n:0),0)}});\n  rows.sort(SORT==='err'?(a,b)=>b.err-a.err:SORT==='prog'?(a,b)=>(b.s.done-a.s.done)||(a.s.t-b.s.t):(a,b)=>a.s.n.localeCompare(b.s.n,'zh'));\n  const th=(k,t)=>`<th><button type=\"button\" class=\"btn quiet\" data-sort=\"${k}\" aria-pressed=\"${SORT===k}\">${t}${SORT===k?' ▾':''}<\/button><\/th>`;\n  $('#stable').innerHTML=`<thead><tr>${th('name','姓名')}${th('prog','状态')}${th('err','错次')}<th>一次答对<\/th><th>每一题（Q1 → Q${Q.length}）<\/th><th><\/th><\/tr><\/thead><tbody>`+\n    rows.map(r=>`<tr><td><b>${esc(r.s.n)}<\/b><\/td><td class=\"num\">${r.s.done?'✓ 完成 · '+fmtT(r.s.t):'还在路上'}<\/td><td class=\"num\">${r.s.done?r.err:''}<\/td><td class=\"num\">${r.s.done?r.first+'/'+r.done:''}<\/td>\n      <td><div class=\"heat\">${r.it.map((x,j)=>`<i class=\"${!x?'hn':x.n===0?'h0':x.n===1?'h1':'h2'}\" title=\"Q${j+1} ${esc(Q[j].label)}：${!x?'还没交':x.n===0?'一次答对':'错 '+x.n+' 次'}\"><\/i>`).join('')}<\/div><\/td>\n      <td><button type=\"button\" class=\"btn quiet\" data-del=\"${esc(r.s.sid)}\">移除<\/button><\/td><\/tr>`).join('')+'<\/tbody>';\n}\n$('#stable').addEventListener('click',e=>{\n  const so=e.target.closest('[data-sort]');if(so){SORT=so.dataset.sort;renderStudents(rowsOf(cls()));return}\n  const d=e.target.closest('[data-del]');if(!d)return;\n  if(!d.classList.contains('armed')){d.classList.add('armed','danger');d.textContent='确定移除？';setTimeout(()=>{if(d.isConnected){d.classList.remove('armed','danger');d.textContent='移除'}},4000);return}\n  const c=cls();(c.removed=c.removed||[]).push(d.dataset.del);delete c.rows[d.dataset.del];save();renderClasses();renderAll();\n});\n\n/* ---------- 答案（教师用） ---------- */\n$('#keyList').innerHTML=[0,1,2,3,4].map(k=>`<div class=\"keylist\"><b>${STN[k]} · ${PLACES[k]}（第${ST[k].para.join('、')}段）<\/b>${Q.filter(q=>q.k===k).map(q=>`<div><span class=\"qn\">Q${q.j+1}<\/span> ${q.must?'<span class=\"must\">必答<\/span>':''}${esc(q.label)}：<span class=\"a\">${esc(q.answer)}<\/span><\/div>`).join('')}<\/div>`).join('')\n  +`<div class=\"keylist\"><b>四个导游秘诀<\/b>${SECRETS.map((x,i)=>`<div>${i+1}. ${esc(x.name)}：${esc(x.full)}<\/div>`).join('')}<\/div>`;\n\n/* ---------- 开始 ---------- */\nif(!CUR&&CLASSES.length)CUR=CLASSES[CLASSES.length-1].code;\nstoreNote(SAVED?'各班作答存在这台电脑的浏览器里':'');\nrenderClasses();renderAll();listen();\n\n<\/script>\n<\/html>\n";document.body.appendChild(f)}
